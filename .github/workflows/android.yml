name: Android APK

# Builds the Capacitor Android app on GitHub's machines so no Android SDK is
# needed locally. The APK is uploaded as a workflow artifact; publish it as a
# release asset to make it downloadable from the landing page.

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-*'

permissions:
  contents: read

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36" || sdkmanager --install "platforms;android-35"

      - run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: walnut-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
