name: Desktop installer

# Builds the Windows installer and publishes it to a GitHub Release together with
# latest.yml. The installed desktop app reads latest.yml (electron-updater) from the
# repository's *latest* release to find newer versions, so every desktop release must
# upload both files and claim the latest flag.
#
# An APK-only release published after a desktop release takes the latest flag with it,
# and installed apps then find no latest.yml and cannot update. Create Android releases
# with "set as the latest release" off, or push a fresh desktop-* tag afterwards.

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-*'

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite inlines these at build time, as in the Android workflow.
      - name: Build desktop app
        run: npm run desktop
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Publish the installer and latest.yml to the GitHub Release below, not during the build.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The site links to this fixed name, so the download always serves the newest build.
      - name: Name the installer for the download link
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp "release/Walnut-Setup-$VERSION.exe" release/Walnut-Setup.exe

      - name: Publish release with latest.yml
        if: startsWith(github.ref, 'refs/tags/desktop-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Walnut desktop ${{ github.ref_name }}
          make_latest: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
