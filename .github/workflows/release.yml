name: Release

# One tag, one release, both platforms. `npm run release` bumps package.json, tags v<version>
# and pushes; this workflow builds the Windows installer and the Android APK from that exact
# commit and publishes them together in a single GitHub Release marked "latest".
#
# Both in-app updaters read that same release, so there is one publisher and no competing
# "latest" flag: the desktop app reads latest.yml (electron-updater) and the Android app reads
# the release tag and downloads Walnut.apk.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  EXPECTED_APK_CERT: D2FFD9F3661C1A83ADF149C9AD812C9BE3A5CD82D8E537DF48ABA191049973C0

jobs:
  verify:
    name: Verify the tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "package.json: $VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "tag: $TAG"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json $VERSION. Use npm run release."
              exit 1
            fi
          fi

  android:
    name: Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK platform
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" || echo "::warning::platform 36 install failed"

      - name: Install dependencies
        run: npm ci
        env:
          # The Android build never uses Electron, whose postinstall downloads ~100 MB.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      # Vite inlines these at build time; without them the bundle has no backend.
      - name: Build and sync the web bundle
        run: npm run android:sync
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # assembleRelease, not assembleDebug: a debuggable APK lets adb read the signed-in
      # session and is what security scanners flag as unsafe.
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # The version comes from package.json and the key must match the installed app,
      # otherwise Android refuses the update and users would have to reinstall.
      - name: Verify version, manifest and signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_CODE=$(node -e "const [a,b,c]=require('./package.json').version.split('.').map(Number);console.log(a*10000+b*100+c)")
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          BADGING=$("$BUILD_TOOLS"/aapt2 dump badging "$APK")
          echo "$BADGING" | head -1
          echo "$BADGING" | grep -q "versionName='$VERSION'" || { echo "::error::APK versionName is not $VERSION"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='$EXPECTED_CODE'" || { echo "::error::APK versionCode is not $EXPECTED_CODE"; exit 1; }

          # Shipping a debuggable build is the defect this release pipeline exists to prevent.
          if "$BUILD_TOOLS"/aapt2 dump xmltree --file AndroidManifest.xml "$APK" | grep -q 'debuggable.*=true'; then
            echo "::error::the release APK is debuggable"
            exit 1
          fi

          # The website mirror lives in public/updates so Vercel can serve it. It must never be
          # copied into the app bundle: a nested APK doubles the download and looks like a
          # packed payload to Play Protect, which is how a good build starts failing to install.
          if unzip -l "$APK" | grep -qE 'assets/public/updates/.*\.apk'; then
            echo "::error::the APK bundles a nested copy of the update mirror"
            exit 1
          fi

          VERIFY=$("$BUILD_TOOLS"/apksigner verify --print-certs --verbose "$APK")
          echo "$VERIFY" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' \
            || { echo "::error::APK is not signed with the v2 scheme"; exit 1; }
          echo "$VERIFY" | grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' \
            || { echo "::error::APK is not signed with the v3 scheme"; exit 1; }
          SIGNER=$(echo "$VERIFY" | grep 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr '[:lower:]' '[:upper:]')
          echo "signer: $SIGNER"
          if [ "$SIGNER" != "$EXPECTED_APK_CERT" ]; then
            echo "::error::APK is signed by $SIGNER, not the pinned key. Installed apps would refuse the update."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  desktop:
    name: Windows installer
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Compile the Electron main process
        run: npm run desktop:compile

      # --publish never: this job only builds, the publish job uploads everything at once.
      - name: Package the installer
        run: npx electron-builder --win nsis --publish never

      - name: Check what the updater will read
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          cp "release/Walnut-Setup-$VERSION.exe" release/Walnut-Setup.exe
          grep -q "version: $VERSION" release/latest.yml || { echo "::error::latest.yml does not advertise $VERSION"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installer
          path: |
            release/Walnut-Setup.exe
            release/Walnut-Setup-*.exe
            release/Walnut-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - uses: actions/download-artifact@v4
        with:
          name: desktop-installer
          path: artifacts/desktop

      - name: Resolve the version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Two names: the versioned one for humans, the stable one for /releases/latest/download.
      - name: Name the APK
        run: |
          set -euo pipefail
          cp artifacts/android/app-release.apk "artifacts/android/Walnut-${{ steps.v.outputs.version }}.apk"
          cp artifacts/android/app-release.apk artifacts/android/Walnut.apk

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Walnut v${{ steps.v.outputs.version }}
          body: |
            Walnut ${{ steps.v.outputs.version }}.

            Windows and Android install it themselves: **Check for updates** in Settings.

            If that check reports an error, download the APK from
            https://walnut-budget.vercel.app and install it once over this build.
          # Exactly one workflow may own this flag; both updaters read the latest release.
          make_latest: true
          files: |
            artifacts/android/Walnut.apk
            artifacts/android/Walnut-${{ steps.v.outputs.version }}.apk
            artifacts/desktop/Walnut-Setup.exe
            artifacts/desktop/Walnut-Setup-${{ steps.v.outputs.version }}.exe
            artifacts/desktop/Walnut-Setup-${{ steps.v.outputs.version }}.exe.blockmap
            artifacts/desktop/latest.yml
          fail_on_unmatched_files: true

      # Assert what users will actually download, not what we hoped we uploaded.
      # The asset CDN and the releases API lag a fresh upload by a few seconds, and a single
      # early look used to fail this step after a good publish — which skipped the mirror and
      # the website deploy, so phones silently fell back to the rate-limited GitHub API. All
      # three answers are now checked together, with retries, before this step fails.
      - name: Verify the published release
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          VERSION="${{ steps.v.outputs.version }}"
          APK_CODE="000"
          TAG=""
          for i in $(seq 1 20); do
            APK_CODE=$(curl -s -o /dev/null -w '%{http_code}' -L "https://github.com/$REPO/releases/download/v$VERSION/Walnut.apk")
            YML=$(curl -sL "https://github.com/$REPO/releases/latest/download/latest.yml" || true)
            TAG=$(curl -s "https://api.github.com/repos/$REPO/releases/latest" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).tag_name)}catch{console.log('')}})")

            if [ "$APK_CODE" = "200" ] && printf '%s' "$YML" | grep -q "version: $VERSION" && [ "$TAG" = "v$VERSION" ]; then
              echo "Release v$VERSION is live for desktop and Android."
              exit 0
            fi

            echo "waiting for release metadata (apk=$APK_CODE, latest=$TAG) …"
            sleep 10
          done
          echo "::error::the published release does not advertise v$VERSION (apk=$APK_CODE, latest=$TAG)"
          exit 1

      # The APK is mirrored beside the website so phones download it from the same fast host
      # instead of GitHub's release storage, which crawls on some networks. `latest.json` is
      # the feed the app reads first: a static file on a host users already reach, so version
      # discovery no longer depends on GitHub's API (60 requests per hour per IP, shared by
      # everyone behind a carrier NAT). The checksum lets the app reject a bad download.
      - name: Mirror the APK and publish the update manifest
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p public/updates
          rm -f public/updates/Walnut-*.apk public/updates/Walnut.apk public/updates/latest.json
          cp artifacts/android/Walnut.apk "public/updates/Walnut-$VERSION.apk"
          # A stable name for manual installs and the website's download button. Same bytes,
          # same git blob, so it costs nothing to keep both names.
          cp artifacts/android/Walnut.apk public/updates/Walnut.apk
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const bytes = fs.readFileSync("artifacts/android/Walnut.apk");
            const manifest = {
              version: process.env.VERSION,
              apk: `Walnut-${process.env.VERSION}.apk`,
              bytes: bytes.length,
              sha256: crypto.createHash("sha256").update(bytes).digest("hex"),
            };
            fs.writeFileSync("public/updates/latest.json", JSON.stringify(manifest, null, 2) + "\n");
            console.log(manifest);
          '
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/updates
          if git diff --cached --quiet; then
            echo "the mirror already carries $VERSION"
          else
            git commit -m "Mirror the Walnut $VERSION APK for in-app updates"
            git push origin HEAD:main
          fi

      # Optional: set the VERCEL_DEPLOY_HOOK secret to publish the website with every release.
      - name: Deploy the website
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null

      # A release is not finished until the feed the app reads advertises it. Without this,
      # phones fall back to the rate-limited GitHub API and some of them see nothing at all.
      - name: Verify the in-app update feed
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          FEED="https://walnut-budget.vercel.app/updates/latest.json"
          READY=0
          # Vercel build + upload can take a few minutes for a fresh mirror; 8 minutes is generous.
          for i in $(seq 1 80); do
            if curl -fsS "$FEED?t=$(date +%s)" -o /tmp/walnut-latest.json; then
              if node -e '
                const fs = require("fs");
                const feed = JSON.parse(fs.readFileSync("/tmp/walnut-latest.json", "utf8"));
                process.exit(feed.version === process.env.VERSION && feed.sha256 && feed.bytes > 0 ? 0 : 1);
              '; then
                READY=1
                break
              fi
            fi
            echo "waiting for the website feed to advertise $VERSION …"
            sleep 6
          done
          if [ "$READY" != "1" ]; then
            echo "::error::the website update feed does not advertise $VERSION."
            echo "The release is published, but in-app discovery would fall back to the rate-limited GitHub API."
            echo "Deploy the site (Vercel project budget-tracker) or set VERCEL_DEPLOY_HOOK, then re-run this job."
            exit 1
          fi
          APK=$(node -p 'require("/tmp/walnut-latest.json").apk')
          for ASSET in "$APK" "Walnut.apk"; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L "https://walnut-budget.vercel.app/updates/$ASSET")
            [ "$CODE" = "200" ] || { echo "::error::the mirrored APK /updates/$ASSET answered $CODE"; exit 1; }
          done
          echo "The app feed advertises $VERSION at /updates/$APK (stable name: /updates/Walnut.apk)."
