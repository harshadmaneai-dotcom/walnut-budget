name: Release

# One tag, one release, both platforms. `npm run release` bumps package.json, tags v<version>
# and pushes; this workflow builds the Windows installer and the Android APK from that exact
# commit and publishes them together in a single GitHub Release marked "latest".
#
# Both in-app updaters read that same release, so there is one publisher and no competing
# "latest" flag: the desktop app reads latest.yml (electron-updater) and the Android app reads
# the release tag and downloads Walnut.apk.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  EXPECTED_APK_CERT: D2FFD9F3661C1A83ADF149C9AD812C9BE3A5CD82D8E537DF48ABA191049973C0

jobs:
  verify:
    name: Verify the tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "package.json: $VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "tag: $TAG"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json $VERSION. Use npm run release."
              exit 1
            fi
          fi

  android:
    name: Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK platform
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" || echo "::warning::platform 36 install failed"

      - name: Install dependencies
        run: npm ci
        env:
          # The Android build never uses Electron, whose postinstall downloads ~100 MB.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      # Vite inlines these at build time; without them the bundle has no backend.
      - name: Build and sync the web bundle
        run: npm run android:sync
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # The version comes from package.json and the key must match the installed app,
      # otherwise Android refuses the update and users would have to reinstall.
      - name: Verify version and signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_CODE=$(node -e "const [a,b,c]=require('./package.json').version.split('.').map(Number);console.log(a*10000+b*100+c)")
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          BADGING=$("$BUILD_TOOLS"/aapt2 dump badging "$APK")
          echo "$BADGING" | head -1
          echo "$BADGING" | grep -q "versionName='$VERSION'" || { echo "::error::APK versionName is not $VERSION"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='$EXPECTED_CODE'" || { echo "::error::APK versionCode is not $EXPECTED_CODE"; exit 1; }
          SIGNER=$("$BUILD_TOOLS"/apksigner verify --print-certs "$APK" | grep 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr '[:lower:]' '[:upper:]')
          echo "signer: $SIGNER"
          if [ "$SIGNER" != "$EXPECTED_APK_CERT" ]; then
            echo "::error::APK is signed by $SIGNER, not the pinned key. Installed apps would refuse the update."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  desktop:
    name: Windows installer
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Compile the Electron main process
        run: npm run desktop:compile

      # --publish never: this job only builds, the publish job uploads everything at once.
      - name: Package the installer
        run: npx electron-builder --win nsis --publish never

      - name: Check what the updater will read
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          cp "release/Walnut-Setup-$VERSION.exe" release/Walnut-Setup.exe
          grep -q "version: $VERSION" release/latest.yml || { echo "::error::latest.yml does not advertise $VERSION"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installer
          path: |
            release/Walnut-Setup.exe
            release/Walnut-Setup-*.exe
            release/Walnut-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - uses: actions/download-artifact@v4
        with:
          name: desktop-installer
          path: artifacts/desktop

      - name: Resolve the version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Two names: the versioned one for humans, the stable one for /releases/latest/download.
      - name: Name the APK
        run: |
          set -euo pipefail
          cp artifacts/android/app-debug.apk "artifacts/android/Walnut-${{ steps.v.outputs.version }}.apk"
          cp artifacts/android/app-debug.apk artifacts/android/Walnut.apk

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Walnut v${{ steps.v.outputs.version }}
          body: |
            Walnut ${{ steps.v.outputs.version }}.

            Windows and Android install it themselves: **Check for updates** in Settings.
          # Exactly one workflow may own this flag; both updaters read the latest release.
          make_latest: true
          files: |
            artifacts/android/Walnut.apk
            artifacts/android/Walnut-${{ steps.v.outputs.version }}.apk
            artifacts/desktop/Walnut-Setup.exe
            artifacts/desktop/Walnut-Setup-${{ steps.v.outputs.version }}.exe
            artifacts/desktop/Walnut-Setup-${{ steps.v.outputs.version }}.exe.blockmap
            artifacts/desktop/latest.yml
          fail_on_unmatched_files: true

      # Assert what users will actually download, not what we hoped we uploaded.
      - name: Verify the published release
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          VERSION="${{ steps.v.outputs.version }}"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L "https://github.com/$REPO/releases/download/v$VERSION/Walnut.apk")
            [ "$CODE" = "200" ] && break
            echo "waiting for the APK asset ($CODE) …"
            sleep 6
          done
          [ "$CODE" = "200" ] || { echo "::error::the APK asset is not downloadable"; exit 1; }

          curl -sL "https://github.com/$REPO/releases/latest/download/latest.yml" | grep -q "version: $VERSION" \
            || { echo "::error::latest.yml does not advertise $VERSION"; exit 1; }

          TAG=$(curl -s "https://api.github.com/repos/$REPO/releases/latest" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).tag_name))")
          [ "$TAG" = "v$VERSION" ] || { echo "::error::latest release is $TAG, expected v$VERSION"; exit 1; }

          echo "Release v$VERSION is live for desktop and Android."

      # Optional: set the VERCEL_DEPLOY_HOOK secret to publish the website with every release.
      - name: Deploy the website
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
